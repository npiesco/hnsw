[package]
name = "hnsw"
version = "0.12.0-alpha.0"
authors = ["Geordon Worley <vadixidav@gmail.com>"]
edition = "2024"
description = "Fast approximate nearest neighbors"
keywords = ["hamming", "distance", "nearest", "neighbor", "search"]
categories = ["algorithms", "data-structures", "science"]
repository = "https://github.com/rust-cv/hnsw"
documentation = "https://docs.rs/hnsw/"
license = "MIT"
readme = "README.md"

[features]
serde1 = ["serde"]

[[bench]]
name = "benches"
harness = false

# `dump_serialized` exists to diff serialized output across commits, so it uses
# `serde` unconditionally. Without this gate a plain `cargo test` — no features —
# tries to build it and fails to compile the whole example target.
[[example]]
name = "dump_serialized"
required-features = ["serde1"]

[dependencies]
space = { version = "0.17.0", default-features = false, features = ["alloc"] }
rand_core = "0.6.3"
hashbrown = "0.11.2"
serde = { version = "1.0.126", default-features = false, features = [
    "derive",
    "alloc",
], optional = true }
libm = "0.2.1"
ahash = { version = "0.7.4", default-features = false }
num-traits = { version = "0.2.14", default-features = false }

[dev-dependencies]
space = { version = "0.17.0", features = ["serde", "alloc"] }
rand_pcg = { version = "0.3.1", features = ["serde1"] }
hamming-heap = "0.4.1"
rand = "0.8.4"
criterion = "0.3.4"
gnuplot = "0.0.37"
structopt = "0.3.22"
easybench = "1.1.0"
itertools = "0.10.1"
float-ord = "0.3.1"
byteorder = "1.4.3"
serde_json = "1.0.64"
bincode = "1.3.3"
num-traits = "0.2.14"
bitarray = { version = "0.9.1", default-features = false, features = ["space"] }
memmap2 = "0.9"

[profile.dev]
opt-level = 3

[profile.test]
# The tests take a very long time without optimization.
opt-level = 3

[profile.release]
codegen-units = 1
# This is here so we can generate flamegraphs.
debug = true

[package.metadata.docs.rs]
all-features = true

[lints.rust]
# Warnings are errors for the code this crate owns. Scoped to this package:
# Cargo caps lints for non-path dependencies, so this does not impose the
# setting on downstream consumers.
warnings = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
